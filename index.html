<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How are you feeling?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f4f4f8;
      transition: background 0.5s;
    }
    h1 { font-size: 2.2rem; color: #333; text-align: center; padding: 0 16px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 16px; }
    button {
      font-size: 1.1rem; padding: 12px 22px; border: none; border-radius: 999px;
      cursor: pointer; color: white; transition: transform 0.15s;
    }
    button:hover { transform: scale(1.08); }
    button:active { transform: scale(0.95); }
    #emoji { font-size: 9rem; margin-top: 40px; height: 10rem; }
    .plop { animation: plop 0.4s ease-out, pulse 1.2s ease-in-out 0.4s infinite; }
    @keyframes plop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  </style>
</head>
<body>
  <h1>How are you feeling?</h1>
  <div class="buttons">
    <button style="background:#f5b700" onclick="feel('😄', '#fff6d6')">Happy</button>
    <button style="background:#4a7bd0" onclick="feel('😢', '#dfe8f7')">Sad</button>
    <button style="background:#d64545" onclick="feel('😡', '#f9dede')">Angry</button>
    <button style="background:#e85d9c" onclick="feel('😍', '#fce3ef')">In love</button>
    <button style="background:#7a5cc4" onclick="feel('😱', '#e9e3f7')">Frightened</button>
  </div>
  <div id="emoji"></div>
  <script>
    function feel(emoji, color) {
      const el = document.getElementById('emoji');
      el.textContent = emoji;
      el.classList.remove('plop');
      void el.offsetWidth;
      el.classList.add('plop');
      document.body.style.background = color;
    }
  </script>
</body>
</html>
