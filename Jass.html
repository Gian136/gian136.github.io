<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jass-Zähler</title>

  <!-- PyScript: lets the browser run Python -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1f5c3a;           /* green Jass-Teppich */
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    h1 { margin: 10px 0 4px; font-size: 2rem; }
    h2 { font-size: 1.1rem; margin: 22px 0 10px; font-weight: 600; opacity: .9; }

    /* Trumpf buttons */
    .trumps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .trump {
      font-size: 1rem; padding: 10px 16px; border-radius: 999px; border: 2px solid #fff;
      background: transparent; color: #fff; cursor: pointer; transition: all .15s;
    }
    .trump:hover { background: rgba(255,255,255,.15); }
    .trump.active { background: #fff; color: #1f5c3a; font-weight: 700; transform: scale(1.06); }

    /* Score board */
    .score {
      margin-top: 22px; background: rgba(0,0,0,.25); border-radius: 16px;
      padding: 14px 24px; text-align: center; min-width: 240px; position: relative;
    }
    #total { font-size: 3rem; font-weight: 800; }
    #rest  { opacity: .8; }
    #delta {
      position: absolute; right: 18px; top: 12px; font-weight: 800; font-size: 1.4rem; opacity: 0;
    }
    #delta.show { animation: floatUp .9s ease-out; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    .extras { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
    .extra {
      font-size: .95rem; padding: 8px 14px; border-radius: 10px; border: none; cursor: pointer;
      background: rgba(255,255,255,.15); color: #fff;
    }
    .extra.on { background: #f5c542; color: #333; font-weight: 700; }

    /* Cards */
    #cards { width: 100%; max-width: 900px; }
    .suit-row { margin-bottom: 14px; }
    .suit-name { font-weight: 700; margin: 0 0 6px 4px; }
    .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
    .card {
      background: #fff; color: #222; border-radius: 10px; padding: 8px 2px; text-align: center;
      cursor: pointer; user-select: none; border-top: 6px solid var(--c);
      box-shadow: 0 3px 6px rgba(0,0,0,.3); transition: transform .12s, filter .2s, opacity .2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card .sym  { font-size: 1.4rem; }
    .card .rank { font-weight: 800; font-size: 1rem; }
    .card .pts  { font-size: .8rem; color: #666; }
    .card.taken { filter: grayscale(1); opacity: .4; transform: scale(.94); }
    .card.trumpcard { box-shadow: 0 0 0 3px #f5c542, 0 3px 6px rgba(0,0,0,.3); }

    #hint, #loading { opacity: .85; margin-top: 18px; }

    @media (max-width: 560px) {
      .row { grid-template-columns: repeat(5, 1fr); }
      .card .sym { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <h1>🃏 Jass-Zähler</h1>

  <h2>1. Was isch Trumpf?</h2>
  <div class="trumps">
    <button class="trump" py-click="set_trump" data-mode="schellen">🔔 Schellen</button>
    <button class="trump" py-click="set_trump" data-mode="schilten">🛡️ Schilten</button>
    <button class="trump" py-click="set_trump" data-mode="rosen">🌹 Rosen</button>
    <button class="trump" py-click="set_trump" data-mode="eicheln">🌰 Eicheln</button>
    <button class="trump" py-click="set_trump" data-mode="obenabe">⬇️ Obenabe</button>
    <button class="trump" py-click="set_trump" data-mode="undenufe">⬆️ Undenufe</button>
  </div>

  <div class="score">
    <div>Eui Punkt</div>
    <div id="total">0</div>
    <div id="rest">Gegner: 157</div>
    <div id="delta"></div>
  </div>

  <div class="extras">
    <button class="extra" id="last" py-click="toggle_last">Letschte Stich +5</button>
    <button class="extra" py-click="reset">🔄 Neui Runde</button>
  </div>

  <h2>2. Tipp die Charte a, wo ihr gmacht händ</h2>
  <div id="loading">Python wird glade…</div>
  <div id="cards" py-click="card_click"></div>

  <!-- ================= The Python part ================= -->
  <script type="py">
from pyscript import document

SUITS = {
    "schellen": ("Schellen", "🔔", "#e0a000"),
    "schilten": ("Schilten", "🛡️", "#2a2a2a"),
    "rosen":    ("Rosen",    "🌹", "#d63a3a"),
    "eicheln":  ("Eicheln",  "🌰", "#8a5a2b"),
}
RANKS = ["6", "7", "8", "9", "10", "U", "O", "K", "A"]
LABELS = {"10": "Banner", "U": "Under", "O": "Ober", "K": "König", "A": "Ass"}

# --- game state ---
trump = None          # e.g. "rosen", "obenabe", "undenufe"
taken = set()         # cards you made, e.g. {"rosen-A", "eicheln-U"}
last_trick = False
shown_total = 0


def points(suit, rank, trump):
    """How many points one card is worth for the chosen Trumpf."""
    match trump:
        case "obenabe":
            match rank:
                case "A":  return 11
                case "10": return 10
                case "8":  return 8
                case "K":  return 4
                case "O":  return 3
                case "U":  return 2
                case _:    return 0

        case "undenufe":
            match rank:
                case "6":  return 11
                case "10": return 10
                case "8":  return 8
                case "K":  return 4
                case "O":  return 3
                case "U":  return 2
                case _:    return 0

        case _:  # a suit is Trumpf
            if suit == trump:
                match rank:
                    case "U":  return 20   # Puur
                    case "9":  return 14   # Nell
                    case "A":  return 11
                    case "10": return 10
                    case "K":  return 4
                    case "O":  return 3
                    case _:    return 0
            else:
                match rank:
                    case "A":  return 11
                    case "10": return 10
                    case "K":  return 4
                    case "O":  return 3
                    case "U":  return 2
                    case _:    return 0


def total():
    if trump is None:
        return 0
    s = 0
    for card in taken:
        suit, rank = card.split("-")
        s += points(suit, rank, trump)
    if last_trick:
        s += 5
    return s


def show_delta(diff):
    if diff == 0:
        return
    el = document.getElementById("delta")
    el.textContent = f"+{diff}" if diff > 0 else str(diff)
    el.style.color = "#7CFC7C" if diff > 0 else "#ff8a8a"
    el.classList.remove("show")
    el.offsetWidth          # restart animation
    el.classList.add("show")


def render():
    global shown_total
    cards = document.getElementById("cards")

    if trump is None:
        cards.innerHTML = '<div id="hint">👆 Wähl zerscht de Trumpf.</div>'
    else:
        html = ""
        for suit, (name, sym, color) in SUITS.items():
            is_trump_suit = (suit == trump)
            title = name + (" ⭐ Trumpf" if is_trump_suit else "")
            html += f'<div class="suit-row"><div class="suit-name">{sym} {title}</div><div class="row">'
            for rank in RANKS:
                cid = f"{suit}-{rank}"
                classes = "card"
                if cid in taken:
                    classes += " taken"
                if is_trump_suit:
                    classes += " trumpcard"
                p = points(suit, rank, trump)
                html += (
                    f'<div class="{classes}" data-id="{cid}" style="--c:{color}">'
                    f'<div class="sym">{sym}</div>'
                    f'<div class="rank">{rank}</div>'
                    f'<div class="pts">{p} P</div>'
                    f'</div>'
                )
            html += "</div></div>"
        cards.innerHTML = html

    t = total()
    show_delta(t - shown_total)
    shown_total = t
    document.getElementById("total").textContent = str(t)
    document.getElementById("rest").textContent = f"Gegner: {157 - t}"
    document.getElementById("last").classList.toggle("on", last_trick)


# --- click handlers ---
def set_trump(event):
    global trump
    trump = event.target.closest("button").dataset.mode
    for b in document.querySelectorAll(".trump"):
        b.classList.toggle("active", b.dataset.mode == trump)
    render()


def card_click(event):
    card = event.target.closest(".card")
    if card is None:
        return
    cid = card.dataset.id
    if cid in taken:
        taken.remove(cid)     # second click: card is colored again
    else:
        taken.add(cid)        # first click: card turns gray
    render()


def toggle_last(event):
    global last_trick
    last_trick = not last_trick
    render()


def reset(event):
    global last_trick
    taken.clear()
    last_trick = False
    render()


# Python is ready
document.getElementById("loading").remove()
render()
  </script>
</body>
</html>
